[pytest]
testpaths = tests
addopts = --html=reports/report.html --self-contained-html -v
markers =
    login: 登录相关测试
    dashboard: Wallet首页相关测试
    deposit: Deposit存款相关测试
    transaction: Transaction交易记录相关测试
    withdraw: Withdraw提现相关测试
    convert: Convert兑换相关测试
    treasury: Treasury理财相关测试
    setting: Setting设置相关测试
    orders: 订单相关测试
    smoke: 全量冒烟测试（单次登录顺序跑完所有页面）
