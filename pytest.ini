[pytest]
testpaths = tests
addopts = --html=reports/report.html --self-contained-html -v
markers =
    p0: P0 优先级（登录/菜单、资金流转、金额计算）
    p1: P1 优先级（配置生效、注册与 KYC、交易查询与导出）
    p2: P2 优先级（一般信息维护）
    fund: 真实资金操作，默认 skip，设置 MS_ALLOW_FUND=1 才执行
    e2e: 跨系统用例，依赖运营后台 proto
    creates_data: 会在 SIT 留下数据（注册商户、提交 KYC 等）
    login: 登录相关测试
    dashboard: Wallet首页相关测试
    deposit: Deposit存款相关测试
    transaction: Transaction交易记录相关测试
    withdraw: Withdraw提现相关测试
    convert: Convert兑换相关测试
    treasury: Treasury理财相关测试
    setting: Setting设置相关测试
    orders: 订单相关测试
    security: 会话与安全控制（未登录拦截、退出登录、2FA）
    smoke: 全量冒烟测试（单次登录顺序跑完所有页面）
